settings:
  device: 0
  model_path: '/raid/s3/opengptx/behzad_shomali/checkpoints/2025-10-18__18-35-39_6233b34b/eid_2025-10-18__18-35-39_6233b34b-model-seen_steps_38000-seen_tokens_5603328000-target_steps_39549-target_tokens_5831737344.bin'
  referencing_keys:
    sample_key: input_ids
    target_key: target_ids
    prediction_key: logits
  sequence_length: 128
tokenizer:
  component_key: tokenizer
  variant_key: pretrained_sp_tokenizer
  config:
    tokenizer_model_file: /raid/s3/opengptx/behzad_shomali/modalities/Eurolingua_tokenizer/tokenizer.model
text_inference_component:
  component_key: inference_component
  variant_key: text
  config:
    device: ${settings.device}
    model:
      instance_key: checkpointed_model
      pass_type: BY_REFERENCE
    tokenizer:
      instance_key: tokenizer
      pass_type: BY_REFERENCE
    sequence_length: ${settings.sequence_length}
    eod_token: <|endoftext|>
    prompt_template: '{prompt_input}'
    chat_template: '{user_prompt}'
    temperature: 1
model_raw:
  component_key: model
  variant_key: gpt2
  config:
    sample_key: ${settings.referencing_keys.sample_key}
    prediction_key: ${settings.referencing_keys.prediction_key}
    poe_type: NOPE
    sequence_length: ${settings.sequence_length}
    vocab_size: 251008
    n_layer: 12
    n_head_q: 32
    n_head_kv: 32
    n_embd: 1024
    ffn_hidden: 4096
    dropout: 0.0
    bias: false
    activation_type: swiglu
    attention_implementation: manual
    attention_config:
      qkv_transforms:
      - type_hint: RotaryTransform
        config:
          n_embd: ${model_raw.config.n_embd}
          n_head: ${model_raw.config.n_head_q}
          seq_length_dim: -2
          base_freq: 10000
    attention_norm_config:
      norm_type: layer_norm
      config:
        normalized_shape: ${model_raw.config.n_embd}
        eps: 1.0e-05
    ffn_norm_config:
      norm_type: layer_norm
      config:
        normalized_shape: ${model_raw.config.n_embd}
        eps: 1.0e-05
    lm_head_norm_config:
      norm_type: layer_norm
      config:
        normalized_shape: ${model_raw.config.n_embd}
        eps: 1.0e-05
    use_weight_tying: false
    recurrent_blocks_indices:
    - - 3
      - 4
      - 5
    - - 7
      - 8
      - 9
    k_last_recurrence_gradient_backprops: -1
    always_propagate_first: false
    recurrent_blocks_max_recurrences:
    - 3
    - 3
    sample_iterations: false
    use_recurrence_embedding: true
wrapped_model:
  component_key: model
  variant_key: fsdp1_wrapped
  config:
    model:
      instance_key: model
      pass_type: BY_REFERENCE
    sync_module_states: true
    mixed_precision_settings: BF_16
    sharding_strategy: FULL_SHARD
    block_names:
    - GPT2Block
    - GroupRecursiveGPT2Block
model:
  component_key: model
  variant_key: model_initialized
  config:
    model:
      instance_key: model_raw
      pass_type: BY_REFERENCE
    model_initializer:
      component_key: model_initialization
      variant_key: composed
      config:
        model_type: gpt2
        weight_init_type: scaled
        mean: 0.0
        std: 0.02
        num_layers: ${model_raw.config.n_layer}
checkpointed_model:
  component_key: model
  variant_key: fsdp1_checkpointed
  config:
    checkpoint_loading:
      component_key: checkpoint_loading
      variant_key: torch
      config:
        device: ${settings.device}
        precision: BF16
    model:
      instance_key: model_raw
      pass_type: BY_REFERENCE
    checkpoint_path: ${settings.model_path}
