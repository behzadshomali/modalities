settings:
  experiment_id: ${modalities_env:experiment_id}
  data_dir_cc: ${oc.env:DATA_DIR_CC}
  data_dir_math: ${oc.env:DATA_DIR_MATH}
  checkpoint_saving_path: ${oc.env:CHECKPOINT_SAVING_PATH}
  wandb_mode: ${oc.env:WANDB_MODE_M}
  wandb_path: ${oc.env:WANDB_PATH_M}
  config_file_path: ${modalities_env:config_file_path}
  referencing_keys:
    sample_key: input_ids
    target_key: target_ids
    prediction_key: logits
  cuda_env:
    local_rank: ${cuda_env:LOCAL_RANK}
    global_rank: ${cuda_env:RANK}
    world_size: ${cuda_env:WORLD_SIZE}
  paths:
    checkpoint_saving_path: ${settings.checkpoint_saving_path}
    train_dataset_path: ${settings.data_dir_cc}/Nemotron-CC-highQuality-sampled_data_part_24_eval.pbin
    # test_dataset_path: ${settings.data_dir_math}/Nemotron-CC-Math-v1_train_4plus_part19.pbin
  intervals:
    training_log_interval_in_steps: 10
    checkpointing_interval_in_steps: 9320 # 3 checkpoints
    evaluation_interval_in_steps: 3500
  consistency_enforcement:
    enforce_tokens_per_step_consistency: true
    enforce_last_step_logged: false
    enforce_last_step_evaluated: false
    enforce_last_step_checkpointed: false
  step_profile:
    gradient_accumulation_steps: 10
    local_train_micro_batch_size: 12
    sequence_length: 2048
    dp_degree:
      instance_key: dp_degree
      pass_type: BY_REFERENCE
  training_target: 
    num_target_tokens: 6872432640 #13920178176 # global_num_tokens // sequence_length // num_ranks // local_micro_batch_size // gradient_accumulation_steps
      # component_key: number_conversion
      # variant_key: num_tokens_from_packed_mem_map_dataset_continuous
      # config:
      #   dataset_path: ${settings.paths.train_dataset_path}
      #   sequence_length: ${settings.step_profile.sequence_length}
      #   dp_degree:
      #     instance_key: dp_degree
      #     pass_type: BY_REFERENCE
      #   local_micro_batch_size: ${settings.step_profile.local_train_micro_batch_size}
      #   gradient_accumulation_steps: ${settings.step_profile.gradient_accumulation_steps}
      #   sample_key: ${settings.referencing_keys.sample_key}
    num_target_steps:
      component_key: number_conversion
      variant_key: num_steps_from_num_tokens
      config:
        dp_degree:
          instance_key: dp_degree
          pass_type: BY_REFERENCE
        local_micro_batch_size: ${settings.step_profile.local_train_micro_batch_size}
        global_num_tokens: ${settings.training_target.num_target_tokens}
        sequence_length: ${settings.step_profile.sequence_length}
        gradient_accumulation_steps: ${settings.step_profile.gradient_accumulation_steps}
  training_progress:
    global_num_seen_tokens: 0
    num_seen_steps: 0
    num_seen_samples: 0
    last_step: -1

collate_fn:
  component_key: collate_fn
  variant_key: gpt_2_llm_collator
  config:
    sample_key: ${settings.referencing_keys.sample_key}
    target_key: ${settings.referencing_keys.target_key}

