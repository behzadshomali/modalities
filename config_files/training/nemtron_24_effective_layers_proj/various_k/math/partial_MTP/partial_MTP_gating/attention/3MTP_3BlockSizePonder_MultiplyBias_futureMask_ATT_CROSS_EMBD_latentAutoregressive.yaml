train_dataloader:
  component_key: data_loader
  variant_key: default
  config:
    num_workers: 0
    pin_memory: true
    dataloader_tag: train
    dataset:
      instance_key: train_dataset
      pass_type: BY_REFERENCE
    batch_sampler:
      component_key: batch_sampler
      variant_key: default
      config:
        batch_size: ${settings.step_profile.local_train_micro_batch_size}
        drop_last: true
        sampler:
          component_key: sampler
          variant_key: resumable_distributed_sampler
          config:
            dataset:
              instance_key: train_dataset
              pass_type: BY_REFERENCE
            rank: ${settings.cuda_env.global_rank}
            num_replicas: ${settings.cuda_env.world_size}
            shuffle: true
            seed: 42
            drop_last: true
            skip_num_global_samples: ${settings.training_progress.num_seen_samples}
    collate_fn:
      instance_key: collate_fn
      pass_type: BY_REFERENCE

test_dataset:
  component_key: dataset
  variant_key: combined
  config:
    datasets:
    - component_key: dataset
      variant_key: packed_mem_map_dataset_continuous
      config:
        raw_data_path: ${settings.data_dir_cc}/Nemotron-CC-highQuality-sampled_data_part_23_part_00_SMALL_EVAL.pbin
        sequence_length: ${settings.step_profile.sequence_length}
        sample_key:  ${settings.referencing_keys.sample_key}
    # - component_key: dataset
    #   variant_key: packed_mem_map_dataset_continuous
    #   config:
    #     raw_data_path: ${settings.data_dir_cc}/Nemotron-CC-highQuality-sampled_data_part_23_part_00_SMALL_EVAL.pbin
    #     sequence_length: ${settings.step_profile.sequence_length}
    #     sample_key:  ${settings.referencing_keys.sample_key}

test_dataloader:
  component_key: data_loader
  variant_key: default
  config:
    num_workers: 0
    pin_memory: true
    dataloader_tag: test
    dataset:
      instance_key: test_dataset
      pass_type: BY_REFERENCE
    batch_sampler:
      component_key: batch_sampler
      variant_key: default
      config:
        batch_size: 8
        drop_last: true
        sampler:
          component_key: sampler
          variant_key: distributed_sampler
          config:
            rank: ${settings.cuda_env.global_rank}
            num_replicas: ${settings.cuda_env.world_size}
            shuffle: false
            drop_last: true
            dataset:
              instance_key: test_dataset
              pass_type: BY_REFERENCE
    collate_fn:
      instance_key: collate_fn
      pass_type: BY_REFERENCE


eval_dataloaders:
  - instance_key: test_dataloader
    pass_type: BY_REFERENCE

checkpoint_saving:
  component_key: checkpoint_saving
  variant_key: default
  config:
    checkpoint_saving_strategy:
      component_key: checkpoint_saving_strategy
      variant_key: save_k_most_recent_checkpoints_strategy
      config:
        k: -1
    checkpoint_saving_execution:
      component_key: checkpoint_saving_execution
      variant_key: dcp
      config:
        checkpoint_path: ${settings.paths.checkpoint_saving_path}
        global_rank: ${settings.cuda_env.global_rank}
        experiment_id: ${settings.experiment_id}

loss_fn:
  component_key: loss
  variant_key: clm_mtp_recurrence_loss_iter_aligned
  config:
    target_key: ${settings.referencing_keys.target_key}
    prediction_key: ${settings.referencing_keys.prediction_key}
    mtp_prediction_key: each_recurrence_logits
    mtp_lambda: 0.5  # Initial value (will be overridden by scheduler)
    discount_factor: 1.0
    ponder_weight: 0.005 # 0.05 # Initial value (will be overridden by scheduler)
    # mtp_lambda_scheduler:
    #   instance_key: mtp_lambda_scheduler
    #   pass_type: BY_REFERENCE
    efficiency_lambda_scheduler:
      instance_key: efficiency_lambda_scheduler
      pass_type: BY_REFERENCE

device_mesh:
  component_key: device_mesh
  variant_key: default
  config:
    device_type: cuda
    data_parallel_replicate_degree: 1
    data_parallel_shard_degree: -1
    world_size: ${settings.cuda_env.world_size}

dp_degree:
  component_key: number_conversion
  variant_key: parallel_degree
  config:
    device_mesh:
      instance_key: device_mesh
      pass_type: BY_REFERENCE
    parallelism_methods: [dp_shard, dp_replicate]

app_state:
  component_key: app_state
  variant_key: raw
  config:
    model:
      instance_key: initialized_model
      pass_type: BY_REFERENCE
    optimizer:
      instance_key: optimizer
      pass_type: BY_REFERENCE
    lr_scheduler:
      instance_key: lr_scheduler
      pass_type: BY_REFERENCE
    

initialized_model:
  component_key: model
  variant_key: model_initialized
  config:
    model:
      instance_key: fsdp_model
      pass_type: BY_REFERENCE
    model_initializer:
      component_key: model_initialization
      variant_key: composed
      config:
        model_type: gpt2
        weight_init_type: scaled
        mean: 0.0
        std: 0.02
        num_layers: ${model_raw.config.n_layer}

fsdp_model:
  component_key: model
  variant_key: fsdp2_wrapped
  config:
    model:
      # instance_key: compiled_model
      instance_key: model_raw
      pass_type: BY_REFERENCE
    device_mesh:
      instance_key: device_mesh
      pass_type: BY_REFERENCE
    mixed_precision_settings:
      param_dtype: BF_16
      reduce_dtype: BF_16
    block_names: [GPT2Block]

# compiled_model:
#   component_key: model
#   variant_key: compiled
#   config:
#     model:
#       instance_key: model_raw
#       pass_type: BY_REFERENCE
#     block_names: [GPT2Block,CombinedRepresentationGPT2Block,HaltGPT2Block] #GroupRecursiveGPT2MTPBlock

model_raw:
  component_key: model
  variant_key: gpt2
  config:
    use_meta_device: false
    sample_key: ${settings.referencing_keys.sample_key}
    poe_type: NOPE
    sequence_length: ${settings.step_profile.sequence_length}
    prediction_key: ${loss_fn.config.prediction_key}
    vocab_size: 50304 # GPT-2 vocab_size of 50257, padded up to nearest multiple of 64 for efficiency
    n_layer: 12
    n_head_q: 32
    n_head_kv: 32
    ffn_hidden: 4096
    n_embd: 1024
    dropout: 0.0
    bias: false
    attention_config:
      qkv_transforms:
        - type_hint: RotaryTransform
          config:
            n_embd: ${model_raw.config.n_embd}
            n_head: ${model_raw.config.n_head_q} #it has to be head_q here
            seq_length_dim: -2
            base_freq: 10000
      qk_norm_config:
        norm_type: pytorch_rms_norm
        config:
          normalized_shape: 32 # n_embd / n_head
          eps: 1.0e-05
    attention_implementation: pytorch_flash
    activation_type: swiglu
    attention_norm_config:
      norm_type: pytorch_rms_norm
      config:
        normalized_shape: ${model_raw.config.n_embd}
        eps: 1.0e-05
    ffn_norm_config:
      norm_type: pytorch_rms_norm
      config:
        normalized_shape: ${model_raw.config.n_embd}
        eps: 1.0e-05
    lm_head_norm_config:
      norm_type: pytorch_rms_norm
      config:
        normalized_shape: ${model_raw.config.n_embd}
        eps: 1.0e-05
    use_weight_tying: false
    # recurrent_blocks_indices: [[1,2],[4,5],[7,8],[-10,-11]]
    recurrent_blocks_indices: [[-9,-10,-11]]
    
    recurrent_blocks_max_recurrences: 3
    
    use_recurrence_embedding: true
    use_LNS: true
    track_recurrence_embd_similarity: false
    return_each_recurrence_output: true
    separate_lm_head_norm: false
    use_last_iteration_output_as_final: false
    use_combined_representation: true
    halt_threshold: 0.5
    aggregation_type: ATT_CROSS_EMBD
    use_per_iter_norms: true
    use_latent_autoregressive: true
    do_shifted_input: false
    gates_bias: [0.55, -5.0, -5.0] # Set the biases for the gates (one for each gate).
    future_masking_prob: 0.0 # Probability of applying future masking in the attention mechanism (1.0 means always apply).

lr_scheduler:
  component_key: scheduler
  variant_key: onecycle_lr
  config:
    optimizer:
      instance_key: optimizer
      pass_type: BY_REFERENCE
    max_lr: 0.001889 #0.002953
    cycle_momentum: false
    div_factor: 10
    final_div_factor: 1
    total_steps: ${settings.training_target.num_target_steps}
    pct_start: 0.001
    anneal_strategy: cos
    last_epoch: ${settings.training_progress.last_step}



optimizer:
  component_key: optimizer
  variant_key: muon
  config:
    lr: 0.001889 #0.002953
    adamw_betas: [0.9, 0.95]
    adamw_eps: 1e-8
    weight_decay: 0.0132 #1/(28682*0,002624)
    weight_decay_groups_excluded: [embedding, layernorm, pytorch_rms_norm]
    wrapped_model:
      instance_key: initialized_model
      pass_type: BY_REFERENCE


gradient_clipper:
  component_key: gradient_clipper
  variant_key: fsdp2
  config:
    wrapped_model:
      instance_key: initialized_model
      pass_type: BY_REFERENCE
    norm_type: P2_NORM
    max_norm: 1.0
    device_mesh:
      instance_key: device_mesh
      pass_type: BY_REFERENCE

progress_subscriber:
  component_key: progress_subscriber
  variant_key: rich
  config:
    global_rank: ${settings.cuda_env.global_rank}
    num_seen_steps: ${settings.training_progress.num_seen_steps}
    num_target_steps: ${settings.training_target.num_target_steps}
    train_dataloader_tag: ${train_dataloader.config.dataloader_tag}
    eval_dataloaders:
      instance_key: eval_dataloaders
      pass_type: BY_REFERENCE

evaluation_subscriber:
  component_key: results_subscriber
  variant_key: wandb
  config:
    global_rank: ${settings.cuda_env.global_rank}
    project: nemotron_MATH_PartialMTP_Gating
    mode: ${settings.wandb_mode}
    experiment_id: LatentAutoReg${model_raw.config.use_latent_autoregressive}_${model_raw.config.aggregation_type}_LinearStyleGateNorm_mask${model_raw.config.future_masking_prob}_MultiplyBias=${model_raw.config.gates_bias}_PonderLoss_HaltingTh=${model_raw.config.halt_threshold}_k=${model_raw.config.n_layer}_L=${model_raw.config.recurrent_blocks_max_recurrences}_${model_raw.config.recurrent_blocks_indices}_recurEmbed=${model_raw.config.use_recurrence_embedding}_${settings.experiment_id}
    tags: [257M, Partial_MTP, 2Token, GradProj]
    directory: ${settings.wandb_path}
    config_file_path: ${settings.config_file_path}

