datasets:
- instruction_col: problem
  is_in_HF: true
  name: nvidia/OpenMathInstruct-2
  random_seed: 2000
  remove_columns:
  - problem
  - generated_solution
  - expected_answer
  - problem_source
  response_col: generated_solution
  split: train_1M
  test_split_ratio: 0.01
  weight: 1
learn_embed: true
learn_normalization: true
model_name: /raid/s3/opengptx/behzad_shomali/instruction_tuning/_lora+_rank16_alpha16_1M_Markus/2025_09_11-18_57_22/checkpoint-20000/lora_merged/
new_cache_dir: /raid/s3/opengptx/behzad_shomali/custom_hf_cache/
dataset_offset: 80000
global_step: 19999
output_dir_orig: /raid/s3/opengptx/behzad_shomali/instruction_tuning/
peft:
  bias: none
  lora_alpha: 32
  lora_dropout: 0.05
  r: 16
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  task_type: CAUSAL_LM
  use_rslora: true
preprocess_function: format_openmathinstruct2
random_seed: 2000
sft:
  assistant_only_loss: false
  bf16: true
  completion_only_loss: false
  # dataloader_num_workers: 2
  disable_tqdm: false
  do_eval: true
  eval_accumulation_steps: 1
  eval_on_start: true
  eval_steps: 400
  eval_strategy: steps
  fp16: false
  gradient_accumulation_steps: 4
  gradient_checkpointing: True
  greater_is_better: true
  learning_rate: 4.0e-05

  load_best_model_at_end: false
  logging_steps: 20
  lr_scheduler_type: cosine
  max_grad_norm: 0.1
  max_length: 1024
  metric_for_best_model: eval_sacrebleu
  # num_train_epochs: 1
  max_steps: 20000
  optim: paged_adamw_8bit
  output_dir: /raid/s3/opengptx/behzad_shomali/instruction_tuning/
  packing: true
  per_device_eval_batch_size: 8
  per_device_train_batch_size: 4 
  push_to_hub: false
  report_to: wandb
  save_only_model: true
  save_steps: 2000
  save_strategy: steps
  # save_total_limit: 10
  tf32: false
  use_liger_kernel: false
  warmup_ratio: 0.00
  weight_decay: 0.1
train_size: 990000
val_size: 10000
wandb:
  name: lora+_rank16_alpha16_1M_Markus_continue
  project: Teuken3.7B_IT_OpenMathInstruct-2
