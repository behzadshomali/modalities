preprocess_function: format_openmathinstruct2
new_cache_dir: /raid/s3/opengptx/behzad_shomali/custom_hf_cache/
train_size: 300000
model_name: Qwen/Qwen3-4B-Base

# learn_embed: True
# learn_normalization: True

sft:
  output_dir: /raid/s3/opengptx/behzad_shomali/instruction_tuning/
  
  eval_accumulation_steps: 1

  num_train_epochs: 2
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8
  gradient_checkpointing: False
  max_length: 1024
  optim: adamw_torch_fused
  learning_rate: !!float 1e-5
  completion_only_loss: False
  assistant_only_loss: False
  max_grad_norm: 3.0

  dataloader_num_workers: 4
  # dataloader_pin_memory: False
  save_only_model: True

  lr_scheduler_type: linear
  # lr_scheduler_kwargs: 
  #   min_lr: !!float 1e-5

  weight_decay: 0.5
  warmup_steps: 150

  fp16: False
  bf16: True
  tf32: False
  
  packing: True
  use_liger_kernel: False
  
  do_eval: True
  eval_on_start: True
  logging_steps: 20
  eval_steps: 400
  eval_strategy: steps
  save_strategy: steps
  # save_total_limit: 4
  save_steps: 2000
  report_to: wandb
  push_to_hub: False

  metric_for_best_model: eval_sacrebleu
  greater_is_better: True
  load_best_model_at_end: False
  disable_tqdm: False

peft:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules: [
    "q_proj",
    "k_proj",
    "v_proj",
    "o_proj",
    "up_proj",
    "down_proj",
    "gate_proj"
  ]
  use_rslora: True

datasets:
  - is_in_HF: True
    name: nvidia/OpenMathInstruct-2
    split: train_1M
    test_split_ratio: 0.01
    instruction_col: problem
    response_col: generated_solution
    remove_columns: ['problem', 'generated_solution', 'expected_answer', 'problem_source']
    random_seed: 2000
    weight: 1
  

wandb:
  project: Teuken3.73T_IT_OpenMathInstruct-2